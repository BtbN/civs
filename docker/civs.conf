# Apache configuration for a CIVS instance, following INSTALL section 3.
#
# CIVS serves each page in whichever language the browser asks for, through
# type maps (the .var files) that list one variant per language, so
# MultiViews and mod_negotiation are on for both directories. The pages
# themselves are UTF-8 and are installed under a .utf8 suffix.

ServerName localhost

<VirtualHost *:80>
    DocumentRoot /var/www/html

    AddCharset UTF-8 .utf8

    # The home page and the poll creation form.
    <Directory /var/www/html/civs>
        AddHandler type-map .var
        DirectoryIndex index.html.var

        AllowOverride None
        Options None +MultiViews
        Require all granted
    </Directory>

    ScriptAlias /cgi-bin/civs /usr/lib/cgi-bin/civs
    <Directory /usr/lib/cgi-bin/civs>
        AddHandler cgi-script .pl .cgi
        AddHandler type-map .var

        AllowOverride None
        Options None +MultiViews +ExecCGI
        Require all granted

        # The modules beside the scripts are Perl source, not pages, and
        # some of them hold the admin key after install-civs has
        # substituted it in.
        <FilesMatch "\.pm$">
            Require all denied
        </FilesMatch>
    </Directory>

    RedirectMatch ^/$ /civs/

    ErrorLog /dev/stderr
    CustomLog /dev/stdout combined
</VirtualHost>
